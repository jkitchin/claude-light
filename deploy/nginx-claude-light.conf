# /etc/nginx/sites-available/claude-light.cheme.cmu.edu.conf
#
# The Certbot-managed ssl lines are kept as they were.

# Per-IP limits. The instrument does ~1.5 measurements/s for everyone combined,
# so one client asking for more than a couple per second only fills the queue.
limit_req_zone $binary_remote_addr zone=measure:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=pages:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

proxy_cache_path /var/cache/nginx/claude levels=1 keys_zone=claude:1m
                 max_size=50m inactive=10m;

upstream claude_light {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    server_name claude-light.cheme.cmu.edu;
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/claude-light.cheme.cmu.edu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/claude-light.cheme.cmu.edu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    gzip on;
    gzip_types application/json text/css application/javascript text/csv;

    limit_conn perip 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    # A full queue is ~20 s of waiting; the app gives up at 60 s.
    proxy_read_timeout 75s;

    # Let browser apps read the response. These endpoints have no auth and no
    # cookies, so "*" gives away nothing that curl cannot already reach.
    add_header Access-Control-Allow-Origin "*" always;
    # The GitHub Pages client waits as long as Retry-After says when busy.
    add_header Access-Control-Expose-Headers "Retry-After" always;

    # /home/jkitchin is mode 700, so nginx cannot read the files directly;
    # proxy them once and serve from the cache after that.
    location /static/ {
        proxy_cache claude;
        proxy_cache_valid 200 1h;
        expires 1d;
        proxy_pass http://claude_light;
    }

    # Endpoints that run the instrument.
    location ~ ^/(api|csv|rgb|gm|session)$ {
        limit_req zone=measure burst=10;
        proxy_pass http://claude_light;
    }

    location = /stats/data.json {
        limit_req zone=pages burst=20 nodelay;
        proxy_cache claude;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://claude_light;
    }

    location / {
        limit_req zone=pages burst=40 nodelay;
        proxy_pass http://claude_light;
    }
}

server {
    if ($host = claude-light.cheme.cmu.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name claude-light.cheme.cmu.edu;
    return 404; # managed by Certbot
}
